<script>
        const ADMIN_PASSWORD = "admin123";

        const TIME_SCHEDULES = {
            kbm: {
                normal: [
                    { id: 1, name: "Sesi 1", time: "07.30 - 08.50" },
                    { id: 2, name: "Sesi 2", time: "08.50 - 10.40" },
                    { id: 3, name: "Sesi 3", time: "10.40 - 12.00" },
                    { id: 4, name: "Sesi 4", time: "13.30 - 14.50" }
                ],
                sem1: [
                    { id: 1, name: "Jam Pertama", time: "07.00 - 08.20" },
                    { id: 2, name: "Jam Kedua", time: "08.20 - 10.00" },
                    { id: 3, name: "Jam Ketiga", time: "10.00 - 11.20" },
                    { id: 4, name: "Jam Keempat", time: "12.40 - 14.00" }
                ]
            },
            non_kbm: {
                normal: [
                    { id: 1, name: "Sesi Shubuh", time: "05.00 - 06.30" },
                    { id: 2, name: "Sesi Sore", time: "15.45 - 17.00" }
                ],
                sem1: [
                    { id: 1, name: "Sesi 1", time: "14.00 - 15.15" },
                    { id: 2, name: "Sesi 2", time: "15.35 - 17.00" }
                ]
            }
        };

        let activeSystemMode = "normal";
        let isFetching = false;

        const firebaseConfig = {
            databaseURL: "https://labkom-e0a9e-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        document.getElementById("login-form").addEventListener("submit", (e) => {
            e.preventDefault();
            if (document.getElementById("admin-pass").value === ADMIN_PASSWORD) {
                document.getElementById("login-screen").classList.add("hidden");
                document.getElementById("admin-menu").classList.remove("hidden");
                loadData();
            } else {
                alert("Password Salah!");
            }
        });

        function openModule(moduleName) {
            document.getElementById("admin-menu").classList.add("hidden");
            document.querySelectorAll('[id^="module-"]').forEach(el => el.classList.add("hidden"));
            document.getElementById(`module-${moduleName}`).classList.remove("hidden");
            
            if (moduleName === 'time') {
                fetchActiveModeAndRender();
            }
        }

        function backToMenu() {
            document.querySelectorAll('[id^="module-"]').forEach(el => el.classList.add("hidden"));
            document.getElementById("admin-menu").classList.remove("hidden");
        }

        // FUNGSI LOAD DATA BERSIH (CUMA 1 KALI QUERY DATABASE)
        function loadData() {
            if (isFetching) return;
            isFetching = true;

            // Load Data Booking & Damage sekaligus
            db.ref("data_labkom").once("value").then(snapshot => {
                const bookingTbody = document.getElementById("booking-tbody");
                const damageTbody = document.getElementById("damage-tbody");
                bookingTbody.innerHTML = "";
                damageTbody.innerHTML = "";
                
                const data = snapshot.val();
                if (!data) {
                    bookingTbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Belum ada booking masuk.</td></tr>`;
                    damageTbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Belum ada perangkat dikunci.</td></tr>`;
                    return;
                }
                
                let hasValidBooking = false;
                let hasLock = false;
                let damageIndex = 1;

                Object.keys(data).forEach(key => {
                    const item = data[key];

                    // Cek jika kategori Rusak / Lock Device
                    if (item.kategori === "LOCKED DEVICE" || item.jenis === "RUSAK/MAINTENANCE" || (item.nama && item.nama.includes("PERANGKAT RUSAK TOTAL"))) {
                        hasLock = true;
                        const alatID = item.deviceId || item.namaAlat || 'ID-?';
                        damageTbody.innerHTML += `
                            <tr>
                                <td>${damageIndex++}</td>
                                <td><div class="status-rusak-total">⚠️ PERANGKAT RUSAK TOTAL (${alatID})</div></td>
                                <td>${item.lokasi || 'Maintenance Lab'}</td>
                                <td><span class="badge-locked">LOCKED DEVICE</span></td>
                                <td style="text-align: center;">
                                    <button class="btn btn-success btn-sm" onclick="deleteBooking('${key}')">Unlock & Buka</button>
                                </td>
                            </tr>
                        `;
                    } else {
                        // Data Booking Biasa
                        hasValidBooking = true;
                        const idAlat = item.deviceId || item.idAlat || item.pcId || item.laptopId || '-';
                        const jenis = item.jenis || 'Perangkat';
                        const kelas = item.kelas || item.rombel || item.kamar || '-';

                        bookingTbody.innerHTML += `
                            <tr>
                                <td><strong>${item.nama || item.namaPemesan || '-'}</strong></td>
                                <td><span class="badge-device">${idAlat}</span> <br><small style="color:#64748b;">${jenis}</small></td>
                                <td>${item.tanggal || '-'}</td>
                                <td>${item.jam || item.keperluan || '-'}</td>
                                <td>${kelas}</td>
                                <td><button class="btn btn-danger btn-sm" onclick="deleteBooking('${key}')">Hapus</button></td>
                            </tr>
                        `;
                    }
                });

                if (!hasValidBooking) {
                    bookingTbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Belum ada booking peminjaman aktif.</td></tr>`;
                }
                if (!hasLock) {
                    damageTbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Belum ada perangkat yang dikunci.</td></tr>`;
                }
            }).finally(() => {
                isFetching = false;
            });

            // Load Stok Alat
            db.ref("stok_alat").once("value").then(snapshot => {
                const list = document.getElementById("inventory-list");
                list.innerHTML = "";
                const data = snapshot.val();
                if (!data) {
                    list.innerHTML = `<li>Belum ada data alat.</li>`;
                    return;
                }
                Object.keys(data).forEach(name => {
                    list.innerHTML += `
                        <li style="padding:8px 0; border-bottom:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center;">
                            <span><strong>${name}</strong>: ${data[name]} Unit</span>
                            <button class="btn btn-danger btn-sm" onclick="deleteInventory('${name}')">Hapus</button>
                        </li>
                    `;
                });
            });
        }

        function fetchActiveModeAndRender() {
            db.ref("system_config/active_mode").once("value", snapshot => {
                activeSystemMode = snapshot.val() || "normal";
                updateModeButtonUI();
                renderScheduleCards();
            });
        }

        function setSystemMode(mode) {
            if (confirm(`Yakin ingin mengubah seluruh mode jadwal sistem ke ${mode === 'normal' ? 'Jadwal Normal' : 'Jadwal Semester 1'}?`)) {
                db.ref("system_config/active_mode").set(mode).then(() => {
                    activeSystemMode = mode;
                    updateModeButtonUI();
                    renderScheduleCards();
                    alert(`Sistem berhasil di-switch ke ${mode === 'normal' ? 'Jadwal Normal' : 'Jadwal Semester 1'}!`);
                });
            }
        }

        function updateModeButtonUI() {
            const btnNormal = document.getElementById("btn-mode-normal");
            const btnSem1 = document.getElementById("btn-mode-sem1");

            btnNormal.className = "btn-mode";
            btnSem1.className = "btn-mode";

            if (activeSystemMode === "normal") {
                btnNormal.classList.add("active-normal");
                btnNormal.innerHTML = "✅ Mode Aktif: Jadwal Normal";
                btnSem1.innerHTML = "🔄 Switch ke Jadwal Semester 1";
            } else {
                btnSem1.classList.add("active-sem1");
                btnSem1.innerHTML = "✅ Mode Aktif: Jadwal Semester 1";
                btnNormal.innerHTML = "🔄 Switch ke Jadwal Normal";
            }
        }

        function renderScheduleCards() {
            const category = document.getElementById("sched-category").value;
            const day = document.getElementById("sched-day-card").value;
            const container = document.getElementById("session-cards-container");

            const sessions = TIME_SCHEDULES[category][activeSystemMode];
            const dbPath = `schedules/${activeSystemMode}/${category}/${day}`;

            container.innerHTML = `<p style="text-align:center; color:#64748b;">Memuat data sesi...</p>`;

            db.ref(dbPath).once("value", snapshot => {
                const currentData = snapshot.val() || {};
                container.innerHTML = "";

                sessions.forEach(session => {
                    const statusText = currentData[session.id] || "";
                    const isOccupied = statusText.trim() !== "";

                    const card = document.createElement("div");
                    card.className = "session-card";
                    card.innerHTML = `
                        <div class="session-info">
                            <h4>📌 ${session.name}</h4>
                            <span class="session-time">🕒 ${session.time} WIB</span>
                            <div class="session-status">
                                Status: ${isOccupied 
                                    ? `<span style="color:#dc2626;">🔴 ${statusText}</span>` 
                                    : `<span style="color:#16a34a;">🟢 Kosong / Ready</span>`}
                            </div>
                        </div>
                        <div class="session-action">
                            <input type="text" id="input-sesi-${session.id}" value="${statusText}" placeholder="Isi KBM / Keterangan...">
                            <button class="btn btn-primary btn-sm" onclick="saveSessionStatus('${category}', '${day}', ${session.id})">Simpan</button>
                            ${isOccupied ? `<button class="btn btn-danger btn-sm" onclick="clearSessionStatus('${category}', '${day}', ${session.id})">Reset</button>` : ''}
                        </div>
                    `;
                    container.appendChild(card);
                });
            });
        }

        function saveSessionStatus(category, day, sessionId) {
            const val = document.getElementById(`input-sesi-${sessionId}`).value.trim();
            db.ref(`schedules/${activeSystemMode}/${category}/${day}/${sessionId}`).set(val).then(() => {
                alert("Status sesi berhasil disimpan!");
                renderScheduleCards();
            });
        }

        function clearSessionStatus(category, day, sessionId) {
            db.ref(`schedules/${activeSystemMode}/${category}/${day}/${sessionId}`).remove().then(() => {
                alert("Status sesi dikosongkan!");
                renderScheduleCards();
            });
        }

        function deleteBooking(key) { 
            if (confirm("Hapus / Buka Kunci data ini?")) {
                db.ref("data_labkom/" + key).remove().then(() => loadData());
            } 
        }

        function deleteAllBookings() { 
            if (confirm("YAKIN HAPUS SEMUA DATA BOOKING?")) {
                db.ref("data_labkom").remove().then(() => loadData());
            } 
        }

        function deleteInventory(name) { 
            if (confirm(`Hapus ${name}?`)) {
                db.ref("stok_alat/" + name).remove();
                db.ref("inventory/" + name).remove().then(() => loadData());
            }
        }

        document.getElementById("lock-form").addEventListener("submit", (e) => {
            e.preventDefault();
            const lockId = document.getElementById("lock-id").value.trim().toUpperCase();
            if (!lockId) return;

            const lockKey = "LOCK-" + Date.now();

            db.ref("data_labkom/" + lockKey).set({
                id: lockKey,
                deviceId: lockId,
                nama: "⚠️ PERANGKAT RUSAK TOTAL (" + lockId + ")",
                jenis: "RUSAK/MAINTENANCE",
                status: "PERANGKAT RUSAK TOTAL",
                kategori: "LOCKED DEVICE",
                lokasi: "Maintenance Lab",
                tanggal: "PERMANENT",
                jam: "PERMANENT"
            }).then(() => {
                alert(`Unit ${lockId} berhasil dikunci! Semua portal booking kini otomatis menampilkan status RUSAK (Abu-abu).`);
                document.getElementById("lock-id").value = "";
                loadData();
            });
        });

        document.getElementById("inventory-form").addEventListener("submit", (e) => {
            e.preventDefault();
            const name = document.getElementById("inv-name").value;
            const count = parseInt(document.getElementById("inv-count").value);

            db.ref(`stok_alat/${name}`).set(count);
            
            db.ref(`inventory/${name}`).set({ count: count }).then(() => {
                alert(`Berhasil memperbarui jumlah ${name} menjadi ${count} unit!`);
                document.getElementById("inv-count").value = "";
                loadData();
            });
        });
    </script>
